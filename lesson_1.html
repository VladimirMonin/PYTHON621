<!doctype html>
<!-- Это комментарий
lang - язык докуемента 
-->
<html lang="ru">
  <head>
    <!-- Мета - одиночка -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bender</title>
  </head>
  <body>
    <!-- 
    Сниппеты эммета
    ! - шаблон документа
    h1 - пишем тег - получаем тег
    h1+p - пишем тег1 + тег2 - получаем тег1 и тег2
    ul>li - пишем ul > li - получаем ul с вложенным li
    ul>li*3 - пишем ul > li * 3 - получаем ul с 3 вложенными li
    
    -->

    <h1>Анкета Bender</h1>
    <p>Анкета пользователя Bender</p>
    <h2>Биография</h2>
    <p>Анкета пользователя Bender</p>
    <h3>Родился</h3>
    <h3>Образование</h3>
    <h3>Карьера</h3>
    <h2>Интересы</h2>
    <h2>Любимые цитаты</h2>
    <ul>
      <li>Поцелуйте мой блестящий металлический...</li>
      <li>Что-то еще</li>
    </ul>

    <p>Анкета пользователя Bender</p>
  </body>
</html>
